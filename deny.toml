# cargo-deny: checked in CI (.github/workflows/ci.yml). Run locally with
# `cargo deny check`.

[graph]
# Both builds: with the sound feature and without.
all-features = true

[advisories]
# Security advisories always fail; "unmaintained" notices only for crates
# this project uses directly.
unmaintained = "workspace"

[licenses]
# Permissive licences only. A new one needs a deliberate decision here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
