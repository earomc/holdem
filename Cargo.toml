[package]
name = "holdem"
version = "0.5.0"
edition = "2024"
description = "No-limit Texas Hold'em in the terminal: bots, table options, LAN and internet multiplayer (ratatui)"
license = "MIT"

[features]
# Sound effects through rodio. Build with `--no-default-features` for a silent
# game without any audio dependencies (no ALSA headers needed on Linux).
default = ["sound"]
sound = ["dep:rodio"]

[dependencies]
ratatui = "0.30.2"
unicode-width = "0.2"
# Only the playback part of rodio is used; the sounds are synthesized in code,
# so none of the audio file decoders are needed. rodio 0.23 needs Rust 1.87+.
rodio = { version = "0.23", default-features = false, features = ["playback"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", features = ["preserve_order"] }
clap = "4.6.7"

# Keep overflow checks and debug assertions, but make the Monte Carlo bots and the
# exhaustive evaluator tests fast.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
