[workspace]
# `holdem` is the game with sound; `server/` builds the same program as
# `holdem-server` without any audio dependencies, for dedicated servers.
members = [".", "server"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/earomc/holdem"
# The oldest Rust that builds holdem; CI checks it.
rust-version = "1.88"

# Lints for both packages, on top of the defaults.
[workspace.lints.rust]
# src/sound.rs checks `feature = "sound"`, which holdem-server never has.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("sound"))'] }

[workspace.lints.clippy]
uninlined_format_args = "warn"
cast_lossless = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"

[workspace.dependencies]
ratatui = "0.30.2"
unicode-width = "0.2"
clap = "4.6.7"

[package]
name = "holdem"
description = "No-limit Texas Hold'em in the terminal: bots, table options, LAN and internet multiplayer (ratatui)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Sound effects through rodio. Build with `--no-default-features` (or build the
# `holdem-server` package) for a silent game without any audio dependencies
# (no ALSA headers needed on Linux).
default = ["sound"]
sound = ["dep:rodio"]

[dependencies]
ratatui.workspace = true
unicode-width.workspace = true
clap.workspace = true
# Only the playback part of rodio is used; the sounds are synthesized in code,
# so none of the audio file decoders are needed. rodio 0.23 needs Rust 1.87+.
rodio = { version = "0.23", default-features = false, features = ["playback"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", features = ["preserve_order"] }
# Saving edits the settings file in place, keeping comments and layout.
toml_edit = "0.25"

# The Linux release builds link ALSA for the sound feature.
[package.metadata.dist.dependencies.apt]
libasound2-dev = "*"
pkg-config = "*"

# Keep overflow checks and debug assertions, but make the Monte Carlo bots and the
# exhaustive evaluator tests fast.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3

# The profile that cargo-dist builds release archives with.
[profile.dist]
inherits = "release"
lto = "thin"
